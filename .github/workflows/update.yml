# Keep the snapshots current: render every page version iliad-intensive has
# gained since the last run, and commit them here.
#
# Triggered by iliad-intensive's snapshots-dispatch workflow, which starts
# this one (workflow_dispatch) on every push touching tex/ and every fork PR
# update. That repo holds the only secret, SNAPSHOTS_DISPATCH_TOKEN, scoped to
# Actions: write here, so it can start runs but never push. This repo then
# checks out iliad-intensive (public, so no credential) and pushes to itself
# with its own GITHUB_TOKEN. A daily cron is the backstop for a missed
# dispatch, or for when the token is missing or expired.
#
# Most runs find nothing new and stop after a ~10 s dry run (~45 s in all);
# TeX Live and the npm install only happen when there is something to build.
#
# GitHub pauses scheduled workflows in a repo with no activity for 60 days.
# That only affects the backstop; dispatches keep working.
name: update snapshots

on:
  schedule:
    - cron: "17 5 * * *"          # daily backstop
  workflow_dispatch:
    inputs:
      retry_failed:
        description: "Also retry versions recorded as failed (after a pipeline fix)"
        type: boolean
        default: false

# One run at a time: two runs would render the same versions and race to push.
# A burst of dispatches collapses to the running run plus one pending, which
# picks up everything that arrived meanwhile.
concurrency:
  group: update-snapshots
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Side by side, as backfill.mjs expects: its default --src is
      # ../iliad-intensive relative to itself.
      - uses: actions/checkout@v4
        with:
          path: iliad-intensive-snapshots

      # fetch-depth 0: every branch with full history. The backfill renders
      # versions from all of them, not just main.
      - uses: actions/checkout@v4
        with:
          repository: iliad-team/iliad-intensive
          path: iliad-intensive
          fetch-depth: 0
          lfs: true

      # Every PR's head, fork PRs included: a fork's branches are not in this
      # repo, but GitHub keeps each PR's head at refs/pull/<N>/head. Under
      # refs/remotes/ the backfill's --remotes enumeration picks them up.
      # Not refs/pull/<N>/merge: those are synthetic merges nobody wrote.
      - name: Fetch PR heads
        working-directory: iliad-intensive
        run: git fetch -q origin '+refs/pull/*/head:refs/remotes/pull/*'

      - name: Anything new?
        id: check
        working-directory: iliad-intensive-snapshots
        env:
          RETRY: ${{ inputs.retry_failed && '--retry-failed' || '' }}
        run: |
          node backfill.mjs --dry-run $RETRY | tee dry-run.txt
          n=$(sed -nE 's/^([0-9]+) versions? would be built.*/\1/p' dry-run.txt)
          echo "todo=${n:-0}" >> "$GITHUB_OUTPUT"
          rm dry-run.txt

      - uses: actions/setup-node@v4
        if: steps.check.outputs.todo != '0'
        with:
          node-version-file: iliad-intensive/.nvmrc
          cache: npm
          cache-dependency-path: |
            iliad-intensive/package-lock.json
            iliad-intensive/scripts/tex2mdx/package-lock.json

      - name: Install npm dependencies
        if: steps.check.outputs.todo != '0'
        working-directory: iliad-intensive
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix scripts/tex2mdx

      # The source repo's own package list (the one definition, shared with its
      # CI), plus texlive-science: sheets used stmaryrd and physics before the
      # source repo dropped the package on 2026-07-28, and old versions still
      # need them.
      - name: Install TeX Live
        if: steps.check.outputs.todo != '0'
        run: |
          pkgs=$(grep -vE '^\s*(#|$)' iliad-intensive/.github/apt-packages.txt | xargs)
          sudo apt-get update -q -o Acquire::Retries=3
          sudo apt-get install -y -q --no-install-recommends -o Acquire::Retries=3 $pkgs texlive-science

      # Figures of every historical version, not just the checked-out one;
      # without them pdflatex chokes on LFS pointer files. A fork PR's LFS
      # objects may not be fetchable from here; that is only a warning, and
      # the backfill leaves those files as pointers.
      - name: Fetch every LFS object
        if: steps.check.outputs.todo != '0'
        working-directory: iliad-intensive
        run: git lfs fetch --all || echo "::warning::some LFS objects could not be fetched"

      # Exit 2 means some versions failed to render. They are recorded in
      # index.json with their errors, so the run still commits and succeeds.
      - name: Render new versions
        if: steps.check.outputs.todo != '0'
        working-directory: iliad-intensive-snapshots
        env:
          RETRY: ${{ inputs.retry_failed && '--retry-failed' || '' }}
        run: node backfill.mjs $RETRY || [ $? -eq 2 ]

      - name: Commit and push
        if: steps.check.outputs.todo != '0'
        working-directory: iliad-intensive-snapshots
        run: |
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          pipeline=$(git -C ../iliad-intensive rev-parse --short HEAD)
          added=$(git diff --cached --name-only --diff-filter=A -- '*.html' | wc -l)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Snapshots: $added new page version(s), rendered at iliad-intensive $pipeline"
          git pull -q --rebase
          git push

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-logs
          path: iliad-intensive-snapshots/.logs/
          retention-days: 7
